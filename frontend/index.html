<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Class Behavior Tracker</title>
  <style>
    body{font-family: Arial, sans-serif;padding:20px}
    .student{border:1px solid #ddd;padding:8px;margin:8px 0;display:flex;justify-content:space-between;align-items:flex-start}
    .student .left { min-width:260px }
    .groups { display:flex; gap:12px }
    .group { border:1px solid #eee;padding:8px;border-radius:6px;background:#fafafa }
    .group h4 { margin:0 0 8px 0;font-size:14px }
    .buttons button{display:block;margin-bottom:6px}
    #login, #dashboard{max-width:1000px}
    #debugStatus{background:#fff8e1;border:1px solid #ffe082;padding:8px;margin:8px 0;border-radius:4px}
  </style>
</head>
<body>
  <h1>Class Behavior Tracker</h1>
  <div id="login">
    <h2>登入</h2>
    <input id="username" placeholder="email" /><br/><br/>
    <input id="password" placeholder="password" type="password" /><br/><br/>
    <button id="btnLogin">登入</button>
    <p>範例帳號：teacher@example.com / Passw0rd123 或 admin@example.com / Passw0rd123</p>
    <div id="loginMsg"></div>
  </div>

  <div id="dashboard" style="display:none">
    <div>
      <span id="who"></span>
      <button id="btnLogout">登出</button>
    </div>
    <hr/>
    <div id="teacherView" style="display:none">
      <h2>教師面板 <button id="btnDashboard" style="margin-left:12px">查看儀表板</button> <button id="btnExportAll" style="margin-left:12px">匯出全班 (Excel)</button></h2>
      <div>
        <label>選班級（暫預設第一班）</label>
      </div>
      <div id="debugStatus" aria-live="polite">Debug: 尚未載入學生</div>
      <div id="studentsList"></div>
      <h3>最近紀錄</h3>
      <div id="recent"></div>
    </div>

    <div id="studentView" style="display:none">
      <h2>學生檢視（當天紀錄）</h2>
      <div id="studentRecords"></div>
    </div>
  </div>

<script>
const apiBase = '';
let token = null;
let me = null;
let behaviorTypes = [];
let myClass = null;

// group definitions (codes)
const GROUPS = {
  add: {
    title: '加分',
    codes: ['add_question','add_correct','add_group','add_other'],
    isReminder: false
  },
  monitor: {
    title: '股長提醒',
    codes: ['monitor_morning_silence','monitor_respect_classmates','monitor_quiet_study','monitor_calm_lunch','monitor_cleaning_dutiful','monitor_leave_on_time'],
    isReminder: true
  },
  teacher_remind: {
    title: '老師提醒',
    codes: ['teacher_raise_hand','teacher_respect','teacher_remember_warned','teacher_quiet_study','teacher_calm_lunch'],
    isReminder: true
  }
};

async function api(path, method='GET', body=null){
  const headers = { 'Content-Type':'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(apiBase + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401){ alert('未授權或登入逾時，請重新登入'); logout(); throw new Error('unauthorized'); }
  return res.json();
}

document.getElementById('btnLogin').onclick = async ()=>{
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  try{
    const r = await fetch(apiBase + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username, password })});
    const data = await r.json();
    if (r.ok){ token = data.token; me = data.user; localStorage.setItem('cbt_token', token); localStorage.setItem('cbt_user', JSON.stringify(me)); showDashboard(); }
    else { document.getElementById('loginMsg').innerText = data.error || JSON.stringify(data); }
  }catch(e){ console.error(e); document.getElementById('loginMsg').innerText = '登入失敗'; }
}

function logout(){ token=null; me=null; localStorage.removeItem('cbt_token'); localStorage.removeItem('cbt_user'); document.getElementById('dashboard').style.display='none'; document.getElementById('login').style.display='block'; }

document.getElementById('btnLogout').onclick = ()=>logout();

async function showDashboard(){
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('who').innerText = '登入者：' + me.display_name + ' ('+me.role+')';
  if (me.role === 'teacher' || me.role === 'admin'){
    document.getElementById('teacherView').style.display='block';
    // dashboard button
    document.getElementById('btnDashboard').onclick = () => { window.location.href = '/dashboard.html'; };
    // export all button with from/to prompts
    document.getElementById('btnExportAll').onclick = async () => {
      try{
        const from = prompt('From (YYYY-MM-DD) — leave empty for no lower bound', '');
        const to = prompt('To (YYYY-MM-DD) — leave empty for no upper bound', '');
        let url = `/api/classes/${myClass.id}/export`;
        const qs = [];
        if (from) qs.push('from=' + encodeURIComponent(from));
        if (to) qs.push('to=' + encodeURIComponent(to));
        if (qs.length) url += '?' + qs.join('&');

        const tokenHeader = token ? { 'Authorization': 'Bearer ' + token } : {};
        const res = await fetch(url, { headers: tokenHeader });
        if (!res.ok){ const err = await res.json().catch(()=>null); alert('匯出失敗: ' + (err&&err.error?err.error:res.statusText)); return; }
        const arrayBuffer = await res.arrayBuffer();
        const blob = new Blob([arrayBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const urlBlob = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = urlBlob; a.download = `class_${myClass.id}_records.xlsx`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(urlBlob);
      }catch(e){ console.error(e); alert('匯出發生錯誤'); }
    };

    await loadBehaviorTypes();
    await loadMyClass();
    await loadStudents();
    await loadRecent();
  } else if (me.role === 'student'){
    document.getElementById('studentView').style.display='block';
    await loadStudentRecords();
  }
}

async function loadBehaviorTypes(){
  try{
    behaviorTypes = await api('/api/behavior-types');
    if (!Array.isArray(behaviorTypes)) behaviorTypes = [];
    console.log('behaviorTypes loaded', behaviorTypes);
  }catch(e){ console.error('Failed to load behavior types', e); behaviorTypes = []; }
}

async function loadMyClass(){
  try{
    myClass = await api('/api/my-class');
    if (!myClass) myClass = { id:1, name:'Class A' };
    console.log('myClass', myClass);
  }catch(e){ console.error('Failed to load class', e); myClass = { id:1, name:'Class A' }; }
}

// helper to find behavior type id by code
function btId(code){ const b = (behaviorTypes||[]).find(x=>x.code===code); return b? b.id : null; }

// get today's date string
function todayStr(){ return new Date().toISOString().slice(0,10); }

// Update counts for a student (today) per group and optionally show reminders
async function updateCountsAndMaybeAlert(student, remindedGroup, justAdded){
  try{
    const rows = await api(`/api/records?class_id=${myClass.id}&student_id=${student.id}&date=${todayStr()}`);
    // rows contain behavior_code
    const counts = { add:0, monitor:0, teacher_remind:0 };
    for (const r of rows){
      for (const gk of Object.keys(GROUPS)){
        if (GROUPS[gk].codes.includes(r.behavior_code)) counts[gk]++;
      }
    }
    // update DOM
    const wrapper = document.getElementById('student-'+student.id);
    if (wrapper){
      for (const gk of Object.keys(GROUPS)){
        const el = wrapper.querySelector(`.group-count[data-group="${gk}"]`);
        if (el) el.innerText = counts[gk];
      }
    }

    // If justAdded indicates we need to check reminders for that group
    if (justAdded && remindedGroup && GROUPS[remindedGroup].isReminder){
      const c = counts[remindedGroup];
      if (c === 3){
        alert(`${student.student_no}號已第3筆`);
      } else if (c === 4){
        alert('以第4筆，請思考上學規格');
      }
    }
  }catch(e){ console.error('updateCounts failed', e); }
}

// Updated loadStudents to render groups and counts
async function loadStudents(){
  try{
    const list = await api('/api/classes/'+myClass.id+'/students');
    const container = document.getElementById('studentsList'); container.innerHTML='';
    const debug = document.getElementById('debugStatus');
    debug.innerText = 'Debug: 載入學生中...';
    console.log('students list', list);
    if (!Array.isArray(list) || list.length === 0){
      debug.innerText = 'Debug: 目前沒有學生或載入失敗';
    }

    for (const s of list){
      const div = document.createElement('div'); div.className='student'; div.id = 'student-'+s.id;
      const left = document.createElement('div'); left.className='left'; left.innerHTML = `<div><strong>${s.student_no} - ${s.name}</strong></div>`;
      const groupsWrap = document.createElement('div'); groupsWrap.className='groups';

      for (const gk of Object.keys(GROUPS)){
        const g = GROUPS[gk];
        const groupEl = document.createElement('div'); groupEl.className='group';
        const header = document.createElement('h4'); header.innerHTML = `${g.title} (<span class="group-count" data-group="${gk}">0</span>)`;
        groupEl.appendChild(header);
        const btns = document.createElement('div'); btns.className='buttons';

        // create buttons for codes in this group
        for (const code of g.codes){
          const bt = (behaviorTypes||[]).find(x=>x.code===code);
          const label = bt ? bt.label : code;
          const b = document.createElement('button'); b.innerText = label;
          b.onclick = async () => {
            // determine point delta: if behaviorTypes has default_point use it, else 0
            const point = bt ? bt.default_point : 0;
            try{
              await api('/api/records','POST',{ class_id: myClass.id, student_id: s.id, behavior_type_id: bt ? bt.id : null, point_delta: point, note: null });
              // after record created, update counts and check reminder rules
              await updateCountsAndMaybeAlert(s, gk, true);
            }catch(e){ console.error('record create failed', e); alert('記錄失敗'); }
          };
          btns.appendChild(b);
        }

        groupEl.appendChild(btns);
        groupsWrap.appendChild(groupEl);
      }

      div.appendChild(left);
      div.appendChild(groupsWrap);
      container.appendChild(div);

      // initialize counts for this student
      updateCountsAndMaybeAlert(s, null, false);
    }

    debug.innerText = `Debug: 已載入 ${list.length} 位學生： ` + (list.map(x=>x.name).join(', '));
  }catch(e){
    console.error('Failed to load students', e);
    document.getElementById('studentsList').innerText = '載入學生失敗';
    const debug = document.getElementById('debugStatus'); debug.innerText = 'Debug: 載入學生發生錯誤 (請看 Console)';
  }
}

async function loadRecent(){
  try{
    const rows = await api('/api/records?class_id='+myClass.id);
    const container = document.getElementById('recent'); container.innerHTML='';
    rows.forEach(r=>{
      const d = document.createElement('div');
      d.innerText = `${new Date(r.occurred_at).toLocaleString()} | ${r.behavior_label} (${r.point_delta}) | 學生ID:${r.student_id} | 登記:${r.registrar_name || ''} | ${r.note||''}`;
      container.appendChild(d);
    });
  }catch(e){ console.error('Failed to load recent', e); }
}

async function loadStudentRecords(){
  try{
    const rows = await api('/api/records');
    const container = document.getElementById('studentRecords'); container.innerHTML='';
    rows.forEach(r=>{
      const d = document.createElement('div'); d.innerText = `${new Date(r.occurred_at).toLocaleString()} | ${r.behavior_label} (${r.point_delta}) | 登記:${r.registrar_name} | ${r.note||''}`;
      container.appendChild(d);
    });
  }catch(e){ console.error('Failed to load student records', e); }
}

// Auto-login if token in localStorage
(function(){
  const t = localStorage.getItem('cbt_token');
  const u = localStorage.getItem('cbt_user');
  if (t && u){ token=t; me=JSON.parse(u); showDashboard(); }
})();
</script>
</body>
</html>
