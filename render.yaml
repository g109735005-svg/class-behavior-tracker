# Render configuration for class-behavior-tracker
# Defines a Node web service for the backend and a static site for the frontend.
# Fill in sensitive values in the Render dashboard (DATABASE_URL, JWT_SECRET, etc.).

services:
  - type: web
    name: class-behavior-tracker-backend
    env: node
    repo: g109735005-svg/class-behavior-tracker
    branch: main
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000' # Render will override with $PORT at runtime, but keep for local clarity
      - key: DATABASE_URL
        value: ''
      - key: JWT_SECRET
        value: ''
      - key: RUN_SEED_ON_START
        value: 'false'

  - type: static-site
    name: class-behavior-tracker-frontend
    env: static
    repo: g109735005-svg/class-behavior-tracker
    branch: main
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/build
    envVars:
      - key: REACT_APP_API_BASE
        value: ''

# Notes:
# 1) Adjust `branch` if your default branch is not `main` (e.g., `master` or `develop`).
# 2) Fill DATABASE_URL and JWT_SECRET in the Render dashboard (do NOT commit secrets into git).
# 3) The backend server listens on the port provided by the environment variable $PORT. Render
#    provides this automatically; the start command uses the environment at runtime.
# 4) If your frontend build outputs to a different folder (e.g., `dist`), change `publishPath`.
# 5) If you prefer to use a Docker service instead, you can replace the web service with type: docker
