version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cbt_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cbt_db
      JWT_SECRET: change_this_secret
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/usr/src/app

volumes:
  db-data:
